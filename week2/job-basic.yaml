# Job — Basic one-shot task
# Use case: run a task to completion (batch processing, DB migration, etc.)
# A Job creates pods and ensures they complete successfully
#
# Quick generate:
#   k create job job-basic --image=busybox $do -- echo "hello from job" > job-basic.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: job-basic
spec:
  # backoffLimit: how many times to retry on failure (default: 6)
  backoffLimit: 3

  # activeDeadlineSeconds: hard time limit for the entire job (optional)
  # activeDeadlineSeconds: 30

  template:
    spec:
      containers:
      - name: job-container
        image: busybox:1.35
        command: ['sh', '-c', 'echo "Job started"; sleep 5; echo "Job done!"']

      # restartPolicy for Job pods must be Never or OnFailure (NOT Always)
      # Never: if pod fails, create a NEW pod (up to backoffLimit)
      # OnFailure: restart the same pod container on failure
      restartPolicy: Never

# After applying:
#   k get jobs
#   k get pods            # look for job-basic-xxxxx pod
#   k logs job/job-basic  # see output
#   k describe job job-basic
