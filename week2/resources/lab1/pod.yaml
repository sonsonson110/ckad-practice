apiVersion: v1
kind: Pod
metadata:
  labels:
    run: busybox
  name: date-pod
spec:
  containers:
  - args:
    - sh
    - -c
    - while true; do date; sleep 5; done
    env:
      - name: GREETING
        value: hello-ckad
    image: busybox 
    name: busybox
    resources: 
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
