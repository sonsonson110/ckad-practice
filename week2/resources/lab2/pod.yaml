apiVersion: v1
kind: Pod
metadata:
  labels:
    run: webapp
  name: webapp
spec:
  containers:
  - image: nginx
    name: webapp
    resources: {}
  initContainers:
  - image: busybox
    name: wait-for-db
    command: ["sh","-c","until nslookup mydb.ckad-lab02.svc.cluster.local; do echo waiting for mydb; sleep 2; done"]
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
