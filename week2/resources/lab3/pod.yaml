apiVersion: v1
kind: Pod
metadata:
  labels:
    run: sidecar-demo
  name: sidecar-demo
spec:
  containers:
  - image: busybox
    name: writer
    resources: {}
    volumeMounts:
      - name: log-volume
        mountPath: /var/log/app
    command: ["sh","-c","while true; do date >> /var/log/app/app.log; sleep 2; done"]
  - image: busybox
    name: log-reader
    command: ["sh", "-c","tail -n+1 -f /var/log/app/app.log"]
    resources: {}
    volumeMounts:
      - name: log-volume
        mountPath: /var/log/app
  volumes:
    - name: log-volume
      emptyDir: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
